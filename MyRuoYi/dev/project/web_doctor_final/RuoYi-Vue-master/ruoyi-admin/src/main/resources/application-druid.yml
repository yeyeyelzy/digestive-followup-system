# 数据源与Druid控制台配置。密码和地址必须从部署环境注入。
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: ${DFS_DB_MASTER_URL:${DB_MASTER_URL}}
                username: ${DFS_DB_MASTER_USERNAME:${DB_MASTER_USERNAME}}
                password: ${DFS_DB_MASTER_PASSWORD:${DB_MASTER_PASSWORD}}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: ${DFS_DB_SLAVE_ENABLED:${DB_SLAVE_ENABLED:false}}
                url: ${DFS_DB_SLAVE_URL:${DB_SLAVE_URL:}}
                username: ${DFS_DB_SLAVE_USERNAME:${DB_SLAVE_USERNAME:}}
                password: ${DFS_DB_SLAVE_PASSWORD:${DB_SLAVE_PASSWORD:}}
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 访问白名单，生产环境应设置为受信IP
                allow: ${DFS_DRUID_MONITOR_ALLOW:${DRUID_MONITOR_ALLOW:127.0.0.1}}
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ${DFS_DRUID_MONITOR_USERNAME:${DRUID_MONITOR_USERNAME}}
                login-password: ${DFS_DRUID_MONITOR_PASSWORD:${DRUID_MONITOR_PASSWORD}}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
