files:
  upload:
    path: ${DFS_STORAGE_UPLOAD_DIR:${FILE_UPLOAD_PATH:./var/files/}}
  public-base-url: ${DFS_STORAGE_PUBLIC_BASE_URL:${FILES_PUBLIC_BASE_URL:}}

# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.6
  # 版权年份
  copyrightYear: 2023
  # 实例演示开关
  demoEnabled: true
  # 本地文件路径；部署时由 RUOYI_PROFILE 注入
  profile: ${DFS_STORAGE_PROFILE_DIR:${RUOYI_PROFILE:./var/uploadPath}}
  # 获取IP地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 服务器配置
server:
  # 服务器HTTP端口
  port: ${DFS_BACKEND_PORT:${SERVER_PORT:8080}}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
  # 生成内部链接时的主机名或IP
  ip: ${DFS_BACKEND_HOST:${SERVER_IP:127.0.0.1}}

# 日志配置；环境文件可覆盖
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: ${USER_PASSWORD_MAX_RETRY_COUNT:5}
    # 密码锁定时间（默认10分钟）
    lockTime: ${USER_PASSWORD_LOCK_TIME_MINUTES:10}

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: ${DFS_APP_ENV:${SPRING_PROFILES_ACTIVE:dev}}
  # 数据源配置是后端启动的必需部分。
  config:
    import: classpath:application-druid.yml
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # Redis配置
  redis:
    # 地址
    host: ${DFS_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
    # 端口，默认为6379
    port: ${DFS_REDIS_PORT:${REDIS_PORT:6379}}
    # 数据库索引
    database: ${DFS_REDIS_DATABASE:${REDIS_DATABASE:0}}
    # 可为空；生产环境使用密钥管理服务注入
    password: ${DFS_REDIS_PASSWORD:${REDIS_PASSWORD:}}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：必须由 JWT_SECRET 注入
  secret: ${DFS_AUTH_JWT_SECRET:${JWT_SECRET}}
  # 令牌有效期（默认30分钟）
  expireTime: ${DFS_AUTH_TOKEN_EXPIRE_MINUTES:${TOKEN_EXPIRE_MINUTES:30}}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置；开发环境默认开启，生产环境默认关闭
swagger:
  enabled: ${DFS_SWAGGER_ENABLED:${SWAGGER_ENABLED:false}}
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# AI网关服务配置
ai:
  service:
    base-url: ${DFS_AI_BASE_URL:${AI_SERVICE_BASE_URL:http://127.0.0.1:8010}}
    report-root: ${DFS_AI_REPORT_ROOT:${AI_REPORT_ROOT:./var/ai-reports}}
    timeout-ms: ${DFS_AI_TIMEOUT_MS:${AI_TIMEOUT_MS:30000}}
    rehab-timeout-ms: ${DFS_AI_REHAB_TIMEOUT_MS:${AI_REHAB_TIMEOUT_MS:60000}}
    rehab-view-timeout-ms: ${DFS_AI_REHAB_VIEW_TIMEOUT_MS:${AI_REHAB_VIEW_TIMEOUT_MS:8000}}
    report-timeout-ms: ${DFS_AI_REPORT_TIMEOUT_MS:${AI_REPORT_TIMEOUT_MS:90000}}
    cache-ttl-ms: ${DFS_AI_CACHE_TTL_MS:${AI_CACHE_TTL_MS:300000}}
